name: Host-only checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test host tools (no phone or binary downloads)
        run: python3 -m unittest discover -s tests -v
      - name: Check PID 1 shell syntax
        run: |
          sh -n initramfs/init
          sh -n initramfs/usb-init
      - name: Check whitespace
        run: git diff --check
